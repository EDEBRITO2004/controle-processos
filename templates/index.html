<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Jurídico</title>
    <!-- Link para o CSS externo dentro da pasta static -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- TELA DE ENTRADA (SPLASH SCREEN) -->
    <div id="splash-screen">
        <div class="splash-content">
            <!-- Ícone de Balança Dourada em SVG -->
            <svg class="splash-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Haste Vertical -->
                <rect x="47.5" y="25" width="5" height="42" fill="#ffca28"/>
                <!-- Base da Balança -->
                <polygon points="35,72 65,72 58,67 42,67" fill="#ffca28"/>
                <!-- Topo / Esfera -->
                <circle cx="50" cy="22" r="5" fill="#ffca28"/>
                <!-- Trave Horizontal -->
                <rect x="20" y="32" width="60" height="4" fill="#ffca28"/>
                <!-- Prato Esquerdo -->
                <line x1="25" y1="36" x2="20" y2="52" stroke="#ffca28" stroke-width="2"/>
                <line x1="25" y1="36" x2="30" y2="52" stroke="#ffca28" stroke-width="2"/>
                <path d="M 18 52 Q 25 60 32 52 Z" fill="#ffca28"/>
                <!-- Prato Direito -->
                <line x1="75" y1="36" x2="70" y2="52" stroke="#ffca28" stroke-width="2"/>
                <line x1="75" y1="36" x2="80" y2="52" stroke="#ffca28" stroke-width="2"/>
                <path d="M 68 52 Q 75 60 82 52 Z" fill="#ffca28"/>
            </svg>

            <h1 class="splash-title">Controle Jurídico</h1>
            <div class="splash-subtitle">Por Ede Brito</div>
            <div class="splash-instruction">Clique abaixo para iniciar</div>
            
            <button class="btn-iniciar" onclick="fecharSplash()">🚀 Iniciar Sistema</button>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DO SISTEMA -->
    <main class="main-content">
        <h1>Painel de Controle Jurídico</h1>
        <p>Bem-vindo ao sistema de controle e acompanhamento de processos.</p>
    </main>

    <!-- Script JS externo na pasta static -->
    <script src="/static/js/splash.js"></script>
</body>
</html>
