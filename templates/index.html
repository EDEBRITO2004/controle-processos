<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Jurídico</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d233a 0%, #1e4570 50%, #2a5298 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SVG desenhado com base no Canvas Jetpack Compose */
        .balanca-svg {
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.4));
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #dcdcdc;
            margin-bottom: 6px;
        }

        .instruction {
            font-size: 0.95rem;
            color: #b0c4de;
            margin-bottom: 28px;
        }

        .btn-iniciar {
            background-color: #ffcc00;
            color: #0d233a;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            transition: all 0.3s ease;
        }

        .btn-iniciar:hover {
            background-color: #e6b800;
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
        }

        .btn-iniciar:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Balança da Justiça baseada nas coordenadas do Jetpack Compose -->
        <svg class="balanca-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Haste Vertical (drawLines: w/2, h*0.06 ate w/2, h*0.82) -->
            <line x1="50" y1="6" x2="50" y2="82" stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round"/>

            <!-- Esfera do Topo (drawCircle: r=w*0.045, center=50, 6) -->
            <circle cx="50" cy="6" r="4.5" fill="#ffcc00"/>

            <!-- Travessão Horizontal (drawLine: 12 ate 88 em y=22) -->
            <line x1="12" y1="22" x2="88" y2="22" stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round"/>

            <!-- Prato Esquerdo: Cabo (12,22 ate 12,42) e Arco Semi-circular -->
            <line x1="12" y1="22" x2="12" y2="42" stroke="#ffcc00" stroke-width="2.1" stroke-linecap="round"/>
            <path d="M 1 42 A 11 16 0 0 0 23 42" fill="none" stroke="#ffcc00" stroke-width="2.1" stroke-linecap="round"/>

            <!-- Prato Direito: Cabo (88,22 ate 88,42) e Arco Semi-circular -->
            <line x1="88" y1="22" x2="88" y2="42" stroke="#ffcc00" stroke-width="2.1" stroke-linecap="round"/>
            <path d="M 77 42 A 11 16 0 0 0 99 42" fill="none" stroke="#ffcc00" stroke-width="2.1" stroke-linecap="round"/>

            <!-- Base Trapezoidal (Path: 42,82 -> 58,82 -> 72,95 -> 28,95) -->
            <polygon points="42,82 58,82 72,95 28,95" fill="#ffcc00"/>
        </svg>

        <h1>Controle Jurídico</h1>
        <p class="subtitle">Por Ede Brito</p>
        <p class="instruction">Clique abaixo para iniciar</p>

        <a href="/painel" class="btn-iniciar">
            🚀 Iniciar Sistema
        </a>
    </div>

</body>
</html>
